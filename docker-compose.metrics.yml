# 앱 서버의 지표 노출. docker-compose.yml 과 합쳐서 띄운다.
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d
# 모니터링 서버가 가져갈 수 있게 지표 포트를 내 컴퓨터(127.0.0.1)에만 연다.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  api:
    ports:
      - "127.0.0.1:9404:9404"            # 1단계에서 만든 /metrics. 기존 8080 에 더해진다

  node-exporter:
    image: prom/node-exporter:v1.8.2
    logging: *default-logging
    ports:
      - "127.0.0.1:9100:9100"

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    logging: *default-logging
    command:
      - --mysqld.address=db:3306          # 같은 프로젝트라 서비스 이름으로 찾는다
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    ports:
      - "127.0.0.1:9104:9104"
    depends_on:
      db:
        condition: service_healthy