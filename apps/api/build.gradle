plugins {
    id 'java'
    id 'war'
    // 코드 커버리지. Gradle 기본 제공 플러그인이라 의존성이 늘지 않고, 빌드 산출물(war)에도 섞이지 않는다.
    id 'jacoco'
}

group 'com.kb.tangtang'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    springVersion  = '5.3.39'   // Spring Legacy(Spring MVC). Spring Boot 사용 금지 — 평가 감점
    mybatisVersion = '3.5.16'
    mybatisSpringVersion = '2.1.2'
    jacksonVersion = '2.17.2'
    log4jVersion   = '2.23.1'
    lombokVersion  = '1.18.34'
    junitVersion   = '5.10.2'
    awsSdkVersion  = '2.28.16'  // AWS SDK v2. Boot 의존이 0건이라 금지 기술에 걸리지 않는다
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // ---- Spring Framework (Legacy / MVC) ----
    implementation("org.springframework:spring-context:${springVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation 'javax.inject:javax.inject:1'

    // ---- AOP ----
    implementation 'org.aspectj:aspectjrt:1.9.22'
    implementation 'org.aspectj:aspectjweaver:1.9.22'

    // ---- Servlet ----
    // JSP / JSTL 은 사용하지 않는다 (Vue3 SPA + REST 구조)
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    // ---- Logging ----
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"
    // jdbc4(JDBC 4.0) 는 ResultSet.getObject(String, Class) 가 없어 MyBatis 가 LocalDateTime 컬럼을
    // 읽을 때 AbstractMethodError 가 난다. jdbc4 로 되돌리지 말 것 — LocalDateTime 매핑에 jdbc4.1 이 필수다.
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'

    // ---- XML 파싱(MyBatis 매퍼 내 한글 처리) ----
    implementation 'xerces:xercesImpl:2.12.2'

    // ---- Lombok ----
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    /*
     * ---- Swagger (Springfox) ----
     * springdoc-openapi 는 쓸 수 없다. 1.8.0 이 금지 대상인 Boot 모듈 2종(코어·autoconfigure)을
     * 런타임 의존성으로 끌고 오고(실측), 2.x 는 Spring 6 을 요구한다.
     * Springfox 는 Boot 의존이 0건이라 금지 기술에 걸리지 않는다
     * (`./gradlew :apps:api:dependencies --configuration runtimeClasspath` 로 확인 가능).
     * 3.0.0 이 아니라 2.9.2 인 이유는 수업 자료(Spring 5.3 · Java 17 · war)에서 검증된 조합이기
     * 때문이다. (DECISIONS.md 2026-08-13 (4) 참고)
     *
     * ⚠ commons-logging 을 반드시 뺀다. springfox 2.9.2 가 commons-logging:1.1.3 을 딸려오는데
     *   이 프로젝트는 위 spring-context 에서 이미 그것을 빼고 log4j-slf4j-impl 로 통일해 뒀다.
     *   놔두면 SLF4J 와 JCL 이 이중 바인딩된다.
     */
    implementation('io.springfox:springfox-swagger2:2.9.2') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation('io.springfox:springfox-swagger-ui:2.9.2') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    // ---- JWT (jjwt) — Spring Boot 스타터가 아니므로 금지 기술이 아니다 ----
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ---- JSON ----
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    // java.time(LocalDateTime 등) 직렬화 지원. 없으면 InvalidDefinitionException 으로 500.
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // ---- Database / MyBatis (JPA·Hibernate 사용 금지 — 평가 감점) ----
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"

    /*
     * 그룹 채팅 (이슈 #174).
     * spring-data-redis 는 2.7.x 가 상한이다 — 3.x 는 Spring 6 을 요구해 이 스택(5.3.39)에서 못 쓴다.
     * spring-boot-starter-data-redis 를 쓰면 안 된다(평가 감점). 개별 좌표로 넣고 JavaConfig 로 배선한다.
     */
    implementation "org.springframework:spring-websocket:${springVersion}"
    implementation "org.springframework:spring-messaging:${springVersion}"
    implementation 'org.springframework.data:spring-data-redis:2.7.18'
    implementation 'io.lettuce:lettuce-core:6.2.7.RELEASE'

    /*
     * ---- AWS S3 (이미지 저장소, 이슈 #162) ----
     * 이 프로젝트는 의존성 추가를 자제하지만 S3 는 SDK 없이 쓰기 어려워 예외로 둔다.
     * SDK 자체는 Spring Boot 를 전혀 끌고 오지 않는다(금지 기술 아님).
     *
     * ⚠ 기본 HTTP 클라이언트인 apache-client 를 빼고 url-connection-client 를 쓴다. 이유가 둘이다.
     *   1) apache-client → httpclient 4.5 → **commons-logging** 이 딸려온다. 이 프로젝트는
     *      spring-context·springfox 에서 이미 commons-logging 을 빼고 log4j-slf4j-impl 로
     *      통일해 뒀다. 놔두면 SLF4J 와 JCL 이 이중 바인딩된다.
     *   2) netty-nio-client 는 비동기 클라이언트(S3AsyncClient)용이다. 우리는 동기 S3Client 만
     *      쓰므로 war 에 넣을 이유가 없다.
     * 빼면 SDK 가 기본 클라이언트를 못 찾으므로 ImageStorageConfig 에서
     * httpClientBuilder(UrlConnectionHttpClient.builder()) 를 명시한다.
     */
    implementation("software.amazon.awssdk:s3:${awsSdkVersion}") {
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation "software.amazon.awssdk:url-connection-client:${awsSdkVersion}"

    // micrometer 의존성 추가 (모니터링)
    implementation 'io.micrometer:micrometer-core:1.17.1'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.17.1'


    // ---- Test ----
    implementation "org.springframework:spring-test:${springVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    // spring-test 의 MockRestServiceServer / MockRestRequestMatchers 가 시그니처에 hamcrest 를 쓴다.
    // spring-test POM 이 optional 로 선언해 자동으로 딸려오지 않으므로 테스트 스코프에 직접 얹는다.
    testImplementation 'org.hamcrest:hamcrest:2.2'
    // MockMvc 의 jsonPath() 매처가 JsonPath 를 쓴다.
    // hamcrest 와 마찬가지로 spring-test POM 이 optional 로 선언해 자동으로 딸려오지 않는다.
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
    // 서블릿 API 는 톰캣이 제공하므로 main 은 compileOnly 다.
    // 다만 테스트는 MockHttpServletRequest/Response 를 "실행"하므로 런타임에도 필요하다.
    // testCompileOnly 로 두면 컴파일은 되지만 JUnit5 discovery 에서
    // NoClassDefFoundError: javax/servlet/http/HttpServletResponse 로 죽는다.
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'
}

test {
    useJUnitPlatform()
    // 테스트가 끝나면 커버리지 리포트까지 한 번에 만든다. 따로 태스크를 부를 필요가 없다.
    finalizedBy tasks.named('jacocoTestReport')
}

/*
 * ---- 코드 커버리지 (JaCoCo) ----
 *
 * 리포트: apps/api/build/reports/jacoco/test/html/index.html
 * 실행:   ./gradlew :apps:api:test          (테스트 후 리포트가 자동 생성된다)
 *         ./gradlew :apps:api:jacocoTestReport   (테스트를 다시 돌리지 않고 리포트만)
 *
 * ⚠ 커버리지 숫자를 목표로 삼지 않는다. **어디를 안 건드렸는지 찾는 지도**로 쓴다.
 *   실제 DB 가 필요한 테스트는 팀 규칙상 @Disabled 라(apps/api/AGENTS.md 「테스트」),
 *   그만큼 커버리지가 낮게 나오는 것은 정상이다.
 */
jacoco {
    toolVersion = '0.8.12'   // Java 17 지원 버전
}

jacocoTestReport {
    dependsOn tasks.named('test')

    reports {
        html.required = true    // 사람이 보는 것
        xml.required = true     // CI·뱃지 도구가 읽는 것
        csv.required = false
    }

    /*
     * 로직이 없는 코드는 뺀다. 넣어두면 분모만 키워서 「어디를 안 짰나」가 안 보인다.
     *  - dto : Lombok 이 만든 getter/setter/equals. 테스트할 로직이 아니다
     *  - docs: Swagger 애노테이션만 있는 인터페이스. 실행 코드가 없다
     *  - config: 스프링 설정. 컨텍스트가 떠야 실행되는데 그런 테스트는 @Disabled 다
     */
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/dto/**',
                    '**/docs/**',
                    '**/config/**',
            ])
        }))
    }
}
